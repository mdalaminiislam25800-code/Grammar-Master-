let currentTopic="tense",currentTense=0,currentQuestion=0,score=0,answered=false;
const topicList=document.getElementById("topicList");

function totalQuestions(id){
 if(id==="tense") return tenses.reduce((n,t)=>n+t.questions.length,0);
 const t=topics.find(x=>x.id===id); return t.questions.length;
}
function key(id){return "gm_"+new Date().toISOString().slice(0,10)+"_"+id;}
function correctKey(id){return key(id)+"_correct";}
function getCorrectSet(id){
 try{const v=JSON.parse(localStorage.getItem(correctKey(id))||"[]");return Array.isArray(v)?new Set(v):new Set();}
 catch(e){return new Set();}
}
function getProgress(id){
 const total=totalQuestions(id), set=getCorrectSet(id), done=Math.min(set.size,total);
 return {done,total,pct:total?done/total*100:0};
}
function markCorrect(id,qid){
 const set=getCorrectSet(id);
 set.add(String(qid));
 localStorage.setItem(correctKey(id),JSON.stringify([...set]));
 updateProgress();
 if(currentTopic===id){
   const p=getProgress(id);
   const el=document.querySelector("#detailContent .score");
   if(el) el.innerText=`📊 ${id==="tense"?"Tense":topics.find(x=>x.id===id)?.title||id} Today's Progress: ${p.done} / ${p.total}`;
 }
}
function loadHome(){
 topicList.innerHTML=""; topicList.className="topic-grid";
 topics.forEach(t=>{
  const p=getProgress(t.id),d=document.createElement("div");
  d.className="topic-box";
  d.dataset.search=(t.name+" "+t.title+" "+t.short).toLowerCase();
  const icon=(t.name.match(/^[^ ]+/)||["📚"])[0];
  d.innerHTML=`<div class="topic-icon">${icon}</div><h2>${t.title}</h2><p class="topic-count">${t.id==="tense"?"12 lessons":t.lessons.length+" lessons"}</p><p class="topic-count">${p.done}/${p.total} completed</p>`;
  d.onclick=()=>openTopic(t.id); topicList.appendChild(d);
 });
 updateProgress();
}
function filterTopics(){
 const q=(document.getElementById("searchBox").value||"").toLowerCase().trim();
 document.querySelectorAll("#topicList .topic-box").forEach(d=>{d.style.display=(!q||d.dataset.search.includes(q))?"flex":"none";});
}
function updateProgress(){
 const total=topics.reduce((n,t)=>n+totalQuestions(t.id),0);
 const done=topics.reduce((n,t)=>n+getProgress(t.id).done,0);
 document.getElementById("progressText").innerText=`${done} out of ${total} questions completed today.`;
 document.getElementById("progressBar").style.width=(total?done/total*100:0)+"%";
}
function openTopic(id){
 currentTopic=id;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("detail").classList.remove("hidden");
 if(id==="tense") showTenseGroups(); else renderTopic(id);
}
function showTenseGroups(){
 const p=getProgress("tense");
 let h=`<div class="score">📊 Tense Today's Progress: ${p.done} / ${p.total}</div>
 <div class="card"><h2>📚 Tense</h2><p class="subtitle">Choose a tense group</p>
 <button class="home-btn" onclick="showTenseGroup(0)">🟢 Present Tense</button>
 <button class="home-btn" onclick="showTenseGroup(1)">🔵 Past Tense</button>
 <button class="home-btn" onclick="showTenseGroup(2)">🟣 Future Tense</button>
 </div>`;
 document.getElementById("detailContent").innerHTML=h;
 document.querySelector("#detail > .home-btn").style.display="none";
}
function showTenseGroup(group){
 const ranges=[[0,4],[4,8],[8,12]], names=["Present Tense","Past Tense","Future Tense"];
 const [start,end]=ranges[group];
 let h=`<div class="score">📚 ${names[group]}</div><div class="card"><h2>${names[group]}</h2>`;
 for(let i=start;i<end;i++) h+=`<button class="home-btn" onclick="openTense(${i})">${i-start+1}. ${tenses[i].name}</button>`;
 h+=`</div>`;
 document.getElementById("detailContent").innerHTML=h;
 document.querySelector("#detail > .home-btn").style.display="none";
}
function openTense(i){
 currentTopic="tense";currentTense=i;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("detail").classList.remove("hidden");
 const t=tenses[i],p=getProgress("tense");
 let h=`<div class="score">📊 Tense Today's Progress: ${p.done} / ${p.total}</div>
 <div class="card"><h2>${t.name}</h2><h2>📖 Definition</h2><p>${t.definition}</p>
 <h2>🇧🇩 বাংলা ব্যাখ্যা</h2><p>${t.bangla}</p></div>
 <div class="card"><h2>📐 Formula</h2><div class="formula">${t.formula}</div></div>
 <div class="card"><h2>💡 Examples</h2>`;
 t.examples.forEach((e,n)=>h+=`<div class="example"><b>Example ${n+1}</b><div>${e[0]}</div><span class="bn">বাংলা: ${e[1]}</span></div>`);
 document.getElementById("detailContent").innerHTML=h+"</div>";
 document.querySelector("#detail > .home-btn").style.display="block";
 document.querySelector("#detail > .home-btn").innerText="🎯 Practice This Tense";
}

"It is time":[["It is time we went home.","বাংলা: এখন আমাদের বাড়ি যাওয়ার সময় হয়েছে।"],["It is time you started your work.","বাংলা: এখন তোমার কাজ শুরু করার সময় হয়েছে।"],["It is time they left the place.","বাংলা: এখন তাদের জায়গাটি ছেড়ে যাওয়ার সময় হয়েছে।"]]}
};
function renderTopic(id){
 const t=topics.find(x=>x.id===id),p=getProgress(id);
 let h=`<div class="score">📊 ${t.title} Today's Progress: ${p.done} / ${p.total}</div><div class="card"><h2>${t.name}</h2><p class="subtitle">${t.short}</p></div>`;
 t.lessons.forEach((x,i)=>{
 const ex=(extraExamples[id]&&extraExamples[id][x[0]])||[x[2]];
 h+=`<div class="card"><h2>${i+1}. ${x[0]}</h2><p>${x[1]}</p>`;
 ex.forEach((e,n)=>{
   const en=Array.isArray(e)?e[0]:e;
   const bn=Array.isArray(e)?e[1]:"";
   h+=`<div class="example"><b>Example ${n+1}</b><div>${en}</div>${bn?`<span class="bn">${bn}</span>`:""}</div>`;
  });
 h+=`</div>`;
});
 document.getElementById("detailContent").innerHTML=h;
 document.querySelector("#detail .home-btn").innerText="🎯 Practice This Topic";
}
function showDetail(){
 document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.add("hidden");document.getElementById("detail").classList.remove("hidden");
 if(currentTopic==="tense")openTense(currentTense);else renderTopic(currentTopic);
}
function goHome(){document.getElementById("detail").classList.add("hidden");document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.remove("hidden");loadHome();}
function questions(){return currentTopic==="tense"?tenses[currentTense].questions:topics.find(x=>x.id===currentTopic).questions;}
function startQuiz(){currentQuestion=0;score=0;answered=false;document.getElementById("detail").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion();}
function showQuestion(){
 answered=false;const q=questions()[currentQuestion];
 document.getElementById("questionNumber").innerText=`Question ${currentQuestion+1} of ${questions().length}`;
 document.getElementById("questionText").innerText=q[0];document.getElementById("quizScore").innerText=`Score: ${score}`;
 document.getElementById("answerMessage").innerText="";document.getElementById("nextBtn").classList.add("hidden");
 const o=document.getElementById("options");o.innerHTML="";
 q[1].forEach((x,i)=>{const b=document.createElement("button");b.className="quiz-option";b.innerText=`${String.fromCharCode(65+i)}. ${x}`;b.onclick=()=>checkAnswer(i,b);o.appendChild(b);});
}
function checkAnswer(i,b){
 if(answered)return;answered=true;const q=questions()[currentQuestion];
 document.querySelectorAll(".quiz-option").forEach((x,n)=>{if(n===q[2])x.classList.add("correct");});
 if(i===q[2]){
 score++;
 const qid=currentTopic==="tense"?(`tense_${currentTense}_${currentQuestion}`):String(currentQuestion);
 markCorrect(currentTopic,qid);
 document.getElementById("answerMessage").innerHTML="✅ Correct! খুব ভালো!";
 }
 else{b.classList.add("wrong");document.getElementById("answerMessage").innerHTML=`❌ Wrong! সঠিক উত্তর: <b>${q[1][q[2]]}</b>`;}
 document.getElementById("quizScore").innerText=`Score: ${score}`;document.getElementById("nextBtn").classList.remove("hidden");
}
function nextQuestion(){currentQuestion++;if(currentQuestion>=questions().length)showResult();else showQuestion();}
function showResult(){
 document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
 const total=questions().length;document.getElementById("finalScore").innerText=`🏆 Your Score: ${score} / ${total}`;
 document.getElementById("resultMessage").innerText=score===total?"🎉 অসাধারণ! সবগুলো উত্তর সঠিক হয়েছে!":score>=total/2?"👏 খুব ভালো! আরও একটু Practice করলে আরও ভালো হবে।":"💪 চিন্তা করবেন না। নিয়মগুলো আবার পড়ুন এবং Try Again করুন।";

}
window.onload=loadHome;

</script>
